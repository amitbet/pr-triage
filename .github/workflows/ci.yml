name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['Casks/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Queue pushes to main so each one is tagged and released in order.
  # Pull requests still cancel the previous run.
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  version:
    name: Resolve version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve next release tag
        id: tag
        run: |
          git fetch origin --tags --force
          tag=$(bash scripts/next-version.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Next release is $tag" >> "$GITHUB_STEP_SUMMARY"
  snapshot:
    name: CLI snapshot and serve check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test version bump
        run: bash scripts/next-version-test.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and test pure Go path
        run: go vet ./... && go test ./...
      - name: Smoke-test serve
        run: |
          go build -o "$RUNNER_TEMP/pr-triage" .
          python3 scripts/smoke-release.py "$RUNNER_TEMP/pr-triage"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=publish
  desktop:
    name: Desktop build (${{ matrix.artifact }})
    needs: version
    if: always() && !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macos-arm64
            test_tags: desktop
            output: dist/desktop/PR-Triage-macos-arm64.zip
          - os: ubuntu-24.04
            artifact: linux-amd64
            test_tags: desktop,webkit2_41
            output: dist/desktop/pr-triage-linux-amd64.tar.gz
          - os: windows-latest
            artifact: windows-amd64
            test_tags: desktop
            output: dist/desktop/pr-triage-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 1
      DESKTOP_VERSION: ${{ needs.version.outputs.tag || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Test cgo parser and app
        if: runner.os != 'Windows'
        shell: bash
        run: go test -tags '${{ matrix.test_tags }}' ./...
      - name: Build desktop app
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build-desktop.sh
      - name: Build desktop app on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-desktop.sh
      - name: Test cgo parser and app on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: go test -tags desktop ./...
      - uses: actions/upload-artifact@v4
        with:
          name: pr-triage-${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
  release:
    name: Release
    needs: [version, snapshot, desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.result == 'success' && needs.snapshot.result == 'success' && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          pattern: pr-triage-*
          path: ${{ runner.temp }}/desktop-release
          merge-multiple: true
      - name: Verify desktop packages
        run: |
          test -s "$RUNNER_TEMP/desktop-release/PR-Triage-macos-arm64.zip"
          test -s "$RUNNER_TEMP/desktop-release/pr-triage-linux-amd64.tar.gz"
          test -s "$RUNNER_TEMP/desktop-release/pr-triage-windows-amd64.exe"
          cd "$RUNNER_TEMP/desktop-release"
          sha256sum PR-Triage-macos-arm64.zip pr-triage-linux-amd64.tar.gz pr-triage-windows-amd64.exe > desktop-checksums.txt
      - name: Bump version
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          [[ -n "$tag" ]]
          git fetch origin --tags --force
          expected=$(bash scripts/next-version.sh)
          if [[ "$expected" != "$tag" ]]; then
            echo "version changed from $tag to $expected while builds were running" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${tag}^{}" >/dev/null; then
            if [[ "$(git rev-parse "${tag}^{}")" != "$(git rev-parse HEAD)" ]]; then
              echo "tag $tag already points at a different commit" >&2
              exit 1
            fi
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$tag" -m "Release $tag"
            git push origin "refs/tags/${tag}"
          fi
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: goreleaser/goreleaser-action@v6
        if: steps.existing.outputs.exists != 'true'
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.version.outputs.tag }}
      - name: Upload desktop packages to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/desktop-release/PR-Triage-macos-arm64.zip" \
            "$RUNNER_TEMP/desktop-release/pr-triage-linux-amd64.tar.gz" \
            "$RUNNER_TEMP/desktop-release/pr-triage-windows-amd64.exe" \
            "$RUNNER_TEMP/desktop-release/desktop-checksums.txt" \
            --clobber
      # Casks/** changes do not trigger CI, so this commit does not start a
      # new release.
      - name: Update desktop Homebrew cask
        if: ${{ !contains(needs.version.outputs.tag, '-') }}
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            bash scripts/desktop-cask.sh "$RELEASE_TAG" "$RUNNER_TEMP/desktop-release/PR-Triage-macos-arm64.zip" > Casks/pr-triage-desktop.rb
            git add Casks/pr-triage-desktop.rb
            if git diff --cached --quiet; then exit 0; fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Update Homebrew cask for pr-triage-desktop $RELEASE_TAG"
            git push origin main && exit 0
            sleep 5
          done
          exit 1
