name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['Casks/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cli:
    name: CLI checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build and smoke-test CLI
        run: |
          go build -o "$RUNNER_TEMP/pr-triage" .
          python3 scripts/smoke-release.py "$RUNNER_TEMP/pr-triage"
  snapshot:
    name: CLI release snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=publish
  desktop:
    name: Desktop build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macos-arm64
            test_tags: desktop
            output: dist/desktop/PR-Triage-macos-arm64.zip
          - os: ubuntu-24.04
            artifact: linux-amd64
            test_tags: desktop,webkit2_41
            output: dist/desktop/pr-triage-linux-amd64.tar.gz
          - os: windows-latest
            artifact: windows-amd64
            test_tags: desktop
            output: dist/desktop/pr-triage-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Test cgo parser and app
        if: runner.os != 'Windows'
        shell: bash
        run: go test -tags '${{ matrix.test_tags }}' ./...
      - name: Build desktop app
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build-desktop.sh
      - name: Build desktop app on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-desktop.sh
      - name: Test cgo parser and app on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: go test -tags desktop ./...
      - uses: actions/upload-artifact@v4
        with:
          name: pr-triage-${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
