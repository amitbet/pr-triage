name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go vet ./...
          go test ./...
          go build -o "$RUNNER_TEMP/pr-triage" .
          python3 scripts/smoke-release.py "$RUNNER_TEMP/pr-triage"
      # Publishes the archives and commits Casks/pr-triage.rb to main, which
      # makes this repository its own Homebrew tap.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
