name: Desktop
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-arm64
            artifact: macos-arm64
            test_tags: desktop
            output: dist/desktop/PR-Triage-macos-arm64.zip
          - os: ubuntu-24.04
            artifact: linux-amd64
            test_tags: desktop,webkit2_41
            output: dist/desktop/pr-triage-linux-amd64.tar.gz
          - os: windows-latest
            artifact: windows-amd64
            test_tags: desktop
            output: dist/desktop/pr-triage-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Test cgo parser and app
        if: runner.os != 'Windows'
        shell: bash
        run: go test -tags '${{ matrix.test_tags }}' ./...
      - name: Test cgo parser and app on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: go test -tags desktop ./...
      - name: Build desktop app
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build-desktop.sh
      - name: Build desktop app on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-desktop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pr-triage-${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
